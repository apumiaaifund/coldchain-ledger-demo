<!DOCTYPE html><html><body style="font-family:system-ui,sans-serif;background:#090d16;color:#f1f5f9;max-width:780px;margin:0 auto;padding:28px"><h1>APUMIA ColdChain Ledger — US FDA FSMA 204 Verifier</h1><p>Deterministic Cold-Storage Temperature Excursion &amp; Traceability Lot Code Auditor</p><div style="background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px"><label>Traceability Lot Code (TLC):</label><input id="tlc" value="TLC-2026-8841" style="width:100%;margin:4px 0 10px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><label>Max Recorded Temp (°F):</label><input id="mx" type="number" step="0.1" value="46.5" style="width:100%;margin:4px 0 10px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><label>FDA FSMA Limit (°F):</label><input id="lm" type="number" step="0.1" value="41.0" style="width:100%;margin:4px 0 10px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><label>Excursion Duration (Minutes):</label><input id="mn" type="number" value="45" style="width:100%;margin:4px 0 10px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><label>Cargo Lot Value ($):</label><input id="vl" type="number" value="125000" style="width:100%;margin:4px 0 12px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><button onclick="const bad=(+mx.value>+lm.value)&&(+mn.value>15);r.textContent=`TLC ${tlc.value}: ${bad?'FSMA 204 QUARANTINE / RECALL RISK':'FDA FSMA 204 COMPLIANT'} | Lot Value at Stake: $${(+vl.value).toLocaleString()}.00`" style="padding:11px 18px;border:none;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer">Verify FSMA 204 Lot</button><pre id="r" style="margin-top:14px;color:#10b981;font-size:15px"></pre></div></body></html>
